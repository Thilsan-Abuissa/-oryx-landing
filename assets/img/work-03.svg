<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#FFF" stop-opacity=".32"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
</defs>
<style>
.an-beam{ animation:beam 4.6s ease-in-out infinite alternate; }
